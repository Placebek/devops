version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: oneplusz2
      POSTGRES_DB: library
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: oneplusz2
      POSTGRES_DB: library
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./app:/app

volumes:
  postgres_data:
